spring.application.name=gateway-service
server.port=${GATEWAY_PORT:8086}
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=15s

spring.cloud.gateway.mvc.routes[0].id=product-service
spring.cloud.gateway.mvc.routes[0].uri=${PRODUCT_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.mvc.routes[0].filters[0].name=PreserveHost
spring.cloud.gateway.mvc.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.mvc.routes[0].filters[1].args.id=productService
spring.cloud.gateway.mvc.routes[0].filters[1].args.fallbackUri=forward:/fallback/products

spring.cloud.gateway.mvc.routes[1].id=user-service
spring.cloud.gateway.mvc.routes[1].uri=${USER_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.mvc.routes[1].filters[0].name=PreserveHost
spring.cloud.gateway.mvc.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.mvc.routes[1].filters[1].args.id=userService
spring.cloud.gateway.mvc.routes[1].filters[1].args.fallbackUri=forward:/fallback/users

spring.cloud.gateway.mvc.routes[2].id=order-service
spring.cloud.gateway.mvc.routes[2].uri=${ORDER_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.mvc.routes[2].filters[0].name=PreserveHost
spring.cloud.gateway.mvc.routes[2].filters[1].name=CircuitBreaker
spring.cloud.gateway.mvc.routes[2].filters[1].args.id=orderService
spring.cloud.gateway.mvc.routes[2].filters[1].args.fallbackUri=forward:/fallback/orders

spring.cloud.gateway.mvc.routes[3].id=review-service
spring.cloud.gateway.mvc.routes[3].uri=${REVIEW_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/reviews/**
spring.cloud.gateway.mvc.routes[3].filters[0].name=PreserveHost
spring.cloud.gateway.mvc.routes[3].filters[1].name=CircuitBreaker
spring.cloud.gateway.mvc.routes[3].filters[1].args.id=reviewService
spring.cloud.gateway.mvc.routes[3].filters[1].args.fallbackUri=forward:/fallback/reviews

# Настройки одни на все маршруты: configs.default подхватывается каждым
# circuit breaker-ом, который создаёт фильтр шлюза.
#
# timeout-duration критичен: дефолт resilience4j - 1 СЕКУНДА, и без него любой
# ответ медленнее секунды (создание заказа, регистрация через Keycloak, загрузка
# картинки товара) превращается в 503 из fallback-а. Держим согласованно с read-timeout.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.configs.default.timeout-duration=15s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
