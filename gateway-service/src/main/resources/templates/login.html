<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <title>Вход — Merchly</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script>
        document.documentElement.classList.add('js-motion');
        setTimeout(function () {
            if (!window.Merchly) {
                document.documentElement.classList.remove('js-motion');
            }
        }, 2500);
    </script>
</head>
<body>

<main class="container page-center">
    <div class="col-12 col-sm-9 col-md-6 col-lg-5 col-xl-4">

        <div class="text-center mb-4">
            <a class="rail-brand text-dark" th:href="@{/}">
                <span aria-hidden="true" class="rail-brand__dot"></span>
                Merchly
            </a>
        </div>

        <div class="card shadow border-0 reveal">
            <div class="card-body p-4">
                <h1 class="h4 text-center mb-4 fw-bold">Вход в аккаунт</h1>

                <div class="alert alert-info py-2 small"
                     th:if="${param.reason != null and param.reason[0] == 'unauthorized'}">
                    Войдите, чтобы продолжить.
                </div>

                <div class="alert alert-warning py-2 small"
                     th:if="${param.error != null and param.error[0] == 'session_expired'}">
                    Сессия истекла. Войдите заново.
                </div>

                <div class="alert alert-danger py-2 small"
                     th:if="${param.error != null and param.error[0] == 'true'}">
                    Неверный логин или пароль. Проверьте раскладку и попробуйте ещё раз.
                </div>

                <div class="alert alert-danger py-2 small"
                     th:if="${param.error != null and param.error[0] == 'rate_limited'}">
                    Слишком много попыток входа. Подождите несколько минут и попробуйте снова.
                </div>

                <div class="alert alert-success py-2 small" th:if="${param.logout}">
                    Вы вышли из аккаунта.
                </div>

                <form method="post" th:action="@{/do-login}">
                    <input name="target" th:value="${target}" type="hidden"/>

                    <div class="mb-3">
                        <label class="form-label eyebrow" for="login">Логин или email</label>
                        <input autocomplete="username" class="form-control form-control-lg fs-6" id="login"
                               name="login" placeholder="ivan_merch" required type="text"/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label eyebrow" for="password">Пароль</label>
                        <input autocomplete="current-password" class="form-control form-control-lg fs-6" id="password"
                               name="password" placeholder="••••••••" required type="password"/>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 mb-3" type="submit">Войти</button>
                </form>

                <p class="text-center text-muted small mb-0">
                    Нет аккаунта?
                    <a class="text-decoration-none fw-bold"
                       th:href="@{/registration(target=${target})}">Зарегистрироваться</a>
                </p>
            </div>
        </div>

        <p class="text-center mt-4 mb-0">
            <a class="back-link" th:href="@{/}">
                <span aria-hidden="true" class="back-link__arrow">&larr;</span> На главную
            </a>
        </p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/merchly.js}"></script>

</body>
</html>
