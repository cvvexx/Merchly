services:
  users_db:
    image: postgres:16
    container_name: merchly_users_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data

  products_db:
    image: postgres:16
    container_name: merchly_products_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${PRODUCTS_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      POSTGRES_DB: ${PRODUCTS_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_products:/var/lib/postgresql/data

  reviews_db:
    image: postgres:16
    container_name: merchly_reviews_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${REVIEWS_DB_USER}
      POSTGRES_PASSWORD: ${REVIEWS_DB_PASSWORD}
      POSTGRES_DB: ${REVIEWS_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - pgdata_reviews:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: merchly_redis
    restart: always
    command: "redis-server --requirepass ${REDIS_PASSWORD:-12345678} --appendonly yes"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  keycloak_db:
    image: postgres:16
    container_name: merchly_keycloak_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_keycloak:/var/lib/postgresql/data

  orders_db:
    image: postgres:16
    container_name: merchly_orders_db
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER:-orders_admin}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${ORDERS_DB_NAME:-merchly_orders}
    ports:
      - "5436:5432"
    volumes:
      - pgdata_orders:/var/lib/postgresql/data



  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: merchly_keycloak
    restart: always
    command: start-dev
    env_file:
      - .env.dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      KC_HTTP_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - keycloak_db

  minio:
    image: minio/minio:latest
    container_name: merchly_minio
    restart: always
    env_file:
      - .env.dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: merchly_kafka
    restart: always
    env_file:
      - .env.dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: merchly_config_server
    restart: always
    env_file:
      - .env.dev
    environment:
      CONFIG_SERVER_PROFILE: git
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:-https://github.com/cvvexx/merchly-server-config}
      CONFIG_REPO_BRANCH: ${CONFIG_REPO_BRANCH:-master}
    ports:
      - "8888:8888"

volumes:
  pgdata_users:
  pgdata_products:
  pgdata_reviews:
  pgdata_orders:
  redisdata:
  pgdata_keycloak:
  minio_data:
  kafka: