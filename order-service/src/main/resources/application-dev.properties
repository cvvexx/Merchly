spring.application.name=order-service
server.port=8084
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.apache.hc.client5.http=DEBUG
logging.level.org.springframework.security=DEBUG
spring.datasource.username=${ORDERS_DB_USER:orders_user}
spring.datasource.password=${ORDERS_DB_PASSWORD:12341234}
spring.datasource.url=jdbc:postgresql://${ORDERS_DB_HOST:localhost}:${ORDERS_DB_PORT:5436}/${ORDERS_DB_NAME:merchly_orders}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/merchly
spring.restclient.uri.product_service=${PRODUCT_SERVICE_URI:http://localhost:8081}
spring.restclient.uri.user_service=${USERS_SERVICE_URI:http://localhost:8082}
spring.security.oauth2.client.registration.internal-service-client.client-id=merhcly_orders_client
spring.security.oauth2.client.registration.internal-service-client.client-secret=${ORDERS_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.internal-service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.internal-service-client.scope=openid
spring.security.oauth2.client.registration.internal-service-client.provider=keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8090/realms/merchly/protocol/openid-connect/token
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topics.order-created=order-created
app.kafka.topics.order-failed=order-failed
app.kafka.topics.order-cancelled=order-cancelled
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=io.cvvexxx.orders.event.OrderFailedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:SuperSecretRedisPass2026!}
spring.cache.type=redis