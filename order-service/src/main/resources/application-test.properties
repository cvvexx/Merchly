spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
app.kafka.topics.order-created=order-created
app.kafka.topics.order-failed=order-failed
app.kafka.topics.order-cancelled=order-cancelled
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.restclient.uri.product_service=http://localhost:8081
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
merchly.kafka.topics.order-created=order-created
spring.security.oauth2.client.registration.internal-service-client.client-id=test-client
spring.security.oauth2.client.registration.internal-service-client.client-secret=test-secret
spring.security.oauth2.client.registration.internal-service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.internal-service-client.token-uri=http://localhost:9999/dummy-token-uri