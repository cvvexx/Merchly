spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/merchly
spring.restclient.uri.product_service=http://localhost:8081
spring.kafka.bootstrap-servers=localhost:9092
merchly.kafka.topics.order-created=order-created
