name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Компиляция всех модулей
        run: mvn -B -ntp -DskipTests compile

      - name: Тесты (юнит + интеграционные)
        run: mvn -B -ntp verify

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подготовка env-файлов
        run: |
          cp .env.example .env.prod
          cp .env.example .env.dev

      - name: Валидация compose-файлов
        run: |
          docker compose --env-file .env.prod -f docker-compose.prod.yml config -q
          docker compose --env-file .env.dev  -f docker-compose.dev.yml  config -q

      - name: Сборка образов всех сервисов
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml build
