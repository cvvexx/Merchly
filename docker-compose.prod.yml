services:
  users_db:
    image: postgres:16
    container_name: merchly_users_db
    environment:
      POSTGRES_USER: ${USERS_DB_USER:--user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:--1234}
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  products_db:
    image: postgres:16
    container_name: merchly_products_db
    environment:
      POSTGRES_USER: ${PRODUCTS_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      POSTGRES_DB: ${PRODUCTS_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_products:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PRODUCTS_DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  reviews_db:
    image: postgres:16
    container_name: merchly_reviews_db
    environment:
      POSTGRES_USER: ${REVIEWS_DB_USER}
      POSTGRES_PASSWORD: ${REVIEWS_DB_PASSWORD}
      POSTGRES_DB: ${REVIEWS_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - pgdata_reviews:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${REVIEWS_DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  orders_db:
    image: postgres:16
    container_name: merchly_orders_db
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER:-orders_admin}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-12341234}
      POSTGRES_DB: ${ORDERS_DB_NAME:-merchly_orders}
    ports:
      - "5436:5432"
    volumes:
      - pgdata_orders:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER:-orders_admin}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak_db:
    image: postgres:16
    container_name: merchly_keycloak_db
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_keycloak:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: merchly_redis
    command: "redis-server --requirepass ${REDIS_PASSWORD:-12345678} --appendonly yes"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-12345678} ping | grep PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: merchly_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      KC_HTTP_PORT: 8090
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8090"
    volumes:
      - ./.keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      keycloak_db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: merchly_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: merchly_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/mc
    container_name: merchly_minio_init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./.seed/minio:/seed:ro
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb myminio/merchly-products --ignore-existing;
      /usr/bin/mc mb myminio/merchly-users --ignore-existing;
      /usr/bin/mc anonymous set download myminio/merchly-products;
      /usr/bin/mc anonymous set download myminio/merchly-users;
      /usr/bin/mc mirror --overwrite /seed/products myminio/merchly-products;
      /usr/bin/mc mirror --overwrite /seed/users myminio/merchly-users;
      exit 0;
      "

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: merchly_config_server
    env_file:
      - .env.prod
    environment:
      CONFIG_SERVER_PROFILE: git
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:-https://github.com/cvvexx/merchly-server-config}
      CONFIG_REPO_BRANCH: ${CONFIG_REPO_BRANCH:-master}
    ports:
      - "8888:8888"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  users-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: merchly_users_service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      USERS_DB_HOST: users_db
      USERS_DB_PORT: 5432
      REDIS_HOST: redis
      KEYCLOAK_ISSUER_URI: http://keycloak:8090/realms/merchly
      KEYCLOAK_SERVER_URL: http://keycloak:8090
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      MINIO_URL: http://minio:9000
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
      users_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  products-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: merchly_products_service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      SPRING_DATASOURCE_URL: jdbc:postgresql://products_db:5432/${PRODUCTS_DB_NAME}
      SPRING_DATA_REDIS_HOST: redis
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8090/realms/merchly
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
      products_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: merchly_order_service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders_db:5432/${ORDERS_DB_NAME}
      SPRING_DATA_REDIS_HOST: redis
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8090/realms/merchly
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/merchly/protocol/openid-connect/token
      SPRING_RESTCLIENT_URI_PRODUCT_SERVICE: http://products-service:8081
      SPRING_RESTCLIENT_URI_USER_SERVICE: http://users-service:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
      orders_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      products-service:
        condition: service_healthy
      users-service:
        condition: service_healthy

  reviews-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: merchly_reviews_service
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
      SPRING_DATASOURCE_URL: jdbc:postgresql://reviews_db:5432/${REVIEWS_DB_NAME}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8090/realms/merchly
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
      reviews_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: merchly_gateway_service
    env_file:
      - .env.prod
    environment:
      GATEWAY_PORT: 8086
      PRODUCT_SERVICE_URI: http://products-service:8081
    ports:
      - "8086:8086"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      products-service:
        condition: service_healthy

  frontend-service:
    build:
      context: .
      dockerfile: frontend-service/Dockerfile
    container_name: merchly_frontend
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      SPRING_RESTCLIENT_URI_USER_SERVICE: http://users-service:8082
      SPRING_RESTCLIENT_URI_PRODUCT_SERVICE: http://products-service:8081
      SPRING_RESTCLIENT_URI_REVIEWS_SERVICE: http://reviews-service:8083
      SPRING_RESTCLIENT_URI_ORDERS_SERVICE: http://order-service:8084
      SPRING_DATA_REDIS_HOST: redis
      MINIO_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE: preferred_username
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://localhost:8090/realms/merchly/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/merchly/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: http://keycloak:8090/realms/merchly/protocol/openid-connect/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/merchly/protocol/openid-connect/certs
      FRONTEND_SERVICE_CLIENT_SECRET: ${FRONTEND_SERVICE_CLIENT_SECRET}
    depends_on:
      config-server:
        condition: service_healthy
      users-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
      reviews-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  pgdata_users:
  pgdata_products:
  pgdata_reviews:
  pgdata_orders:
  redisdata:
  pgdata_keycloak:
  minio_data: