# ============================================================
# Единственный локальный файл конфигурации user-service.
# Всё остальное (порт, datasource, redis, keycloak, minio) сервис
# забирает из config-server, репозиторий merchly-server-config:
#   user-service.properties           — общее для всех профилей
#   user-service-{dev,prod}.properties — профильное
#   application*.properties            — общее для всех сервисов
# Секреты сюда не попадают: в config-репозитории лежат плейсхолдеры
# ${...}, значения подставляет окружение самого сервиса (.env).
# ============================================================

# Имя приложения = имя файла в config-репозитории. Должно быть известно
# ДО обращения к config-server, поэтому живёт локально.
spring.application.name=user-service

# optional: сервис поднимается и без config-server (тесты, локальный
# запуск без инфраструктуры). В docker-compose строгость включается
# через CONFIG_FAIL_FAST=true — там отсутствие конфигурации это ошибка.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=${CONFIG_FAIL_FAST:false}
spring.cloud.config.request-connect-timeout=5000
spring.cloud.config.request-read-timeout=10000

# Повторы на случай, когда config-server ещё стартует.
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=3000
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.multiplier=1.3

management.endpoints.web.exposure.include=health,info,refresh
management.endpoint.health.probes.enabled=true
