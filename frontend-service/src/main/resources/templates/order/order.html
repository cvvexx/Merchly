<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заказ #[[${order.id}]] | Merchly</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Навигация -->
<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Кнопка назад -->
    <div class="mb-3">
        <a th:href="@{/orders}" class="text-decoration-none text-secondary">
            <i class="bi bi-arrow-left"></i> К списку заказов
        </a>
    </div>

    <div th:if="${errors}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <h5 class="alert-heading"><i class="bi bi-exclamation-triangle-fill me-2"></i>Ошибка выполнения операции</h5>
        <ul class="mb-0">
            <li th:each="error : ${errors}" th:text="${error}">Текст ошибки</li>
        </ul>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
    </div>

    <!-- Карточка заказа -->
    <div class="card shadow border-0">
        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold">Заказ #<span th:text="${order.id}">12345</span></h4>
            <!-- Статус заказа (можно раскрасить в зависимости от статуса через th:classappend) -->
            <span class="badge bg-primary fs-6 py-2 px-3" th:text="${order.status}">CREATED</span>
        </div>

        <div class="card-body p-4">
            <!-- Дата оформления (если есть в DTO) -->
            <p class="text-muted mb-4" th:if="${order.createdAt != null}">
                Дата оформления: <strong class="text-dark" th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 15:00</strong>
            </p>

            <h5 class="mb-3">Состав заказа</h5>
            <div class="table-responsive mb-4">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Товар</th>
                        <th scope="col">Цена</th>
                        <th scope="col">Кол-во</th>
                        <th scope="col">Сумма</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td>
                            <!-- Предполагается, что в OrderItemDto есть ссылка на товар/название -->
                            <span class="fw-bold" th:text="${item.productId}">Название товара</span>
                        </td>
                        <td th:text="${item.price + ' ₽'}">1000 ₽</td>
                        <td th:text="${item.quantity}">2</td>
                        <td class="fw-bold" th:text="${(item.price * item.quantity) + ' ₽'}">2000 ₽</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Итоговая сумма -->
            <div class="d-flex justify-content-end mb-4">
                <h4 class="mb-0">Итого к оплате:
                    <span class="text-primary fw-bold" th:text="${order.totalAmount + ' ₽'}">0 ₽</span>
                </h4>
            </div>
        </div>

        <!-- КНОПКИ УПРАВЛЕНИЯ ЗАКАЗОМ -->
        <div class="card-footer bg-light p-3 d-flex justify-content-end gap-2">

            <!-- Форма отмены заказа -->
            <!-- Можно скрыть кнопку, если статус уже CANCELED, добавив th:if="${order.status != 'CANCELED'}" -->
            <form method="post" th:action="@{/orders/{id}/cancel(id=${order.id})}" class="m-0">
                <button type="submit" class="btn btn-outline-danger">Отменить заказ</button>
            </form>

            <!-- Форма подтверждения/оплаты заказа -->
            <!-- Можно скрыть, если статус уже CONFIRMED -->
            <form method="post" th:action="@{/orders/{id}/confirm(id=${order.id})}" class="m-0">
                <button type="submit" class="btn btn-success">Подтвердить заказ</button>
            </form>

        </div>
    </div>
</div>

<!-- Скрипт для работы кнопок закрытия алертов (ошибок) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
