<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои заказы | Merchly</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</head>

<style>
    .transition-all {
        transition: all 0.2s ease-in-out;
    }
    .hover-shadow:hover {
        transform: translateY(-2px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>

<body class="bg-light">
<!-- Навигация -->
<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- Заголовок и кнопка назад -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Мои заказы</h2>
        <a th:href="@{/profile}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Назад в профиль
        </a>
    </div>

    <!-- Блок, если список заказов пуст -->
    <div class="alert alert-info shadow-sm" th:if="${orders == null or orders.isEmpty()}">
        <h5 class="alert-heading"><i class="bi bi-info-circle me-2"></i>У вас пока нет заказов</h5>
        <p class="mb-0">Вы еще не сделали ни одной покупки. <a th:href="@{/catalogue/products/list}" class="alert-link">Перейти в каталог</a>, чтобы это исправить!</p>
    </div>

    <!-- Список заказов -->
    <div th:if="${orders != null and !orders.isEmpty()}">
        <div class="row row-cols-1 g-3">

            <!-- Итерируемся по списку заказов -->
            <div class="col" th:each="order : ${orders}">
                <div class="card shadow-sm border-0 h-100 hover-shadow transition-all">
                    <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">

                        <!-- Информация о заказе -->
                        <div>
                            <h5 class="mb-1 fw-bold text-dark">
                                Заказ #<span th:text="${order.id}">123456</span>
                            </h5>

                            <!-- Вывод даты, если она есть в DTO -->
                            <p class="text-muted mb-2 small" th:if="${order.createdAt != null}">
                                <i class="bi bi-calendar3 me-1"></i>
                                Оформлен: <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 15:00</span>
                            </p>

                            <div>
                                <span class="text-secondary me-1">Итого:</span>
                                <strong class="text-primary fs-5" th:text="${order.totalAmount != null ? order.totalAmount + ' ₽' : '0 ₽'}">2500 ₽</strong>
                            </div>
                        </div>

                        <!-- Статус и кнопка подробнее -->
                        <div class="d-flex flex-column align-items-md-end gap-2 mt-2 mt-md-0">
                            <!-- Статус заказа -->
                            <span class="badge bg-secondary px-3 py-2 text-uppercase"
                                  th:classappend="${order.status == 'CONFIRMED' ? 'bg-success' : (order.status == 'CANCELED' ? 'bg-danger' : 'bg-primary')}"
                                  th:text="${order.status}">
                                CREATED
                            </span>

                            <!-- Переход на страницу конкретного заказа (order.html) -->
                            <a class="btn btn-outline-primary btn-sm mt-1" th:href="@{/orders/{id}(id=${order.id})}">
                                Подробнее <i class="bi bi-chevron-right"></i>
                            </a>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>


</body>
</html>
