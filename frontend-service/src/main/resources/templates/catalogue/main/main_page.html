<!DOCTYPE html>
<html lang="ru" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Merchly &ndash; Главная</title>
    <!-- Мета-теги для защиты CSRF в Spring Security -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-3">
            <a class="btn btn-outline-light btn-sm" th:href="@{/catalogue/products/list}">Каталог товаров</a>

            <a class="btn btn-primary btn-sm" sec:authorize="isAnonymous()" th:href="@{/login}">Войти в профиль</a>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <a class="btn btn-info btn-sm" th:href="@{/profile}">Мой профиль</a>
            </div>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm border text-center">
        <div class="container-fluid py-5">
            <h1 class="display-4 fw-bold text-dark">Добро пожаловать в Merchly, <strong th:text="${username}">Пользователь</strong>!
            </h1>
            <p class="col-md-8 fs-5 mx-auto text-muted mt-3">
                Лучший маркетплейс для покупки эксклюзивного мерча и стильных вещей. Наслаждайтесь, выбирайте и
                делайте свой имидж еще ярче.
            </p>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a class="btn btn-primary btn-lg px-4" th:href="@{/catalogue/products/list}">Перейти в каталог</a>
                <a class="btn btn-outline-secondary btn-lg px-4" th:href="@{/profile}">Личный кабинет</a>
            </div>

            <div sec:authorize="isAuthenticated() && !hasRole('ADMIN')" class="mt-5 pt-4 border-top col-md-6 mx-auto">
                <p class="fs-6 fw-semibold text-secondary mb-2">Стать админом?</p>
                <button id="adminRoleBtn" class="btn btn-warning btn-sm px-4 shadow-sm fw-bold" onclick="getAdminRole()">
                    Получить права администратора
                </button>
            </div>
        </div>
    </div>
</div>

<form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;"></form>

<script>
    async function getAdminRole() {
        const btn = document.getElementById('adminRoleBtn');
        btn.disabled = true;

        const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");

        const headers = {};
        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }

        try {
            const response = await fetch('/profile/admin', {
                method: 'POST',
                headers: headers
            });

            if (response.ok) {
                alert('Роль администратора успешно выдана! Сейчас произойдет выход из аккаунта для обновления прав.');

                document.getElementById('logoutForm').submit();
            } else {
                alert('Не удалось получить роль администратора. Попробуйте позже.');
                btn.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Произошла ошибка при отправке запроса.');
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
