<!DOCTYPE html>
<html lang="ru" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>[[${data.product.title}]] &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-detail-img-wrapper {
            max-height: 450px;
            overflow: hidden;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .product-detail-img-wrapper img {
            max-height: 450px;
            width: auto;
            object-fit: contain;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="mb-3">
                <a class="text-decoration-none text-secondary" th:href="@{/catalogue/products/list}">&larr; Вернуться в каталог</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <!-- Изображение товара -->
                    <div class="product-detail-img-wrapper rounded mb-4">
                        <img th:src="@{${data.productImageUrl}}" class="img-fluid" alt="Изображение товара">
                    </div>

                    <!-- Заголовок, продавец и цена -->
                    <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span class="badge bg-secondary">ID: [[${data.product.id}]]</span>

                                <span class="badge bg-info text-dark d-inline-flex align-items-center gap-2 py-1 px-2">
                                    <span>Продавец: [[${data.user != null ? data.user.username : 'Неизвестен'}]]</span>
                                    <img th:if="${data.user != null and data.userAvatarUrl != null}"
                                         th:src="@{${data.userAvatarUrl}}"
                                         alt="Аватар"
                                         class="user-avatar border border-white">
                                </span>
                            </div>
                            <h1 class="h2 fw-bold text-dark m-0" th:text="${data.product.title}">Название товара</h1>
                        </div>

                        <!-- Цена товара -->
                        <div class="text-end ms-3">
                            <span class="fs-3 fw-bold text-success"
                                  th:text="${data.product.price != null ? #numbers.formatDecimal(data.product.price, 1, 'DEFAULT', 2, 'DEFAULT') + ' ₽' : 'Цена не указана'}">
                                0.00 ₽
                            </span>
                        </div>
                    </div>

                    <!-- Описание товара -->
                    <h5 class="fw-bold text-muted">Описание товара</h5>
                    <p class="text-dark bg-light p-3 rounded"
                       th:text="${data.product.description != null ? data.product.description : 'Описание отсутствует.'}"></p>

                    <!-- Панель управления (для админа) -->
                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top"
                         sec:authorize="hasRole('ADMIN')">
                        <a class="btn btn-warning px-4"
                           th:href="@{/catalogue/products/{productId}/edit(productId=${data.product.id})}">Изменить</a>

                        <form class="m-0"
                              method="post" onsubmit="return confirm('Вы уверены, что хотите удалить этот товар?');"
                              th:action="@{/catalogue/products/{productId}/delete(productId=${data.product.id})}">
                            <button class="btn btn-danger px-4" type="submit">Удалить товар</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
