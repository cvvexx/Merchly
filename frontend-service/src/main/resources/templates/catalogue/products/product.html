<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>[[${product.title}]] &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="mb-3">
                <a th:href="@{/catalogue/products/list}" class="text-decoration-none text-secondary">&larr; Вернуться в каталог</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
                        <div>
                            <span class="badge bg-secondary mb-2">ID: [[${product.id}]]</span>
                            <h1 class="h2 fw-bold text-dark m-0" th:text="${product.title}">Название</h1>
                        </div>
                    </div>

                    <h5 class="fw-bold text-muted">Описание товара</h5>
                    <p class="text-dark bg-light p-3 rounded" th:text="${product.description != null ? product.description : 'Описание не указано.'}"></p>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <a th:href="@{/catalogue/products/{productId}/edit(productId=${product.id})}" class="btn btn-warning px-4">Изменить</a>

                        <form th:action="@{/catalogue/products/{productId}/delete(productId=${product.id})}" method="post" class="m-0" onsubmit="return confirm('Вы уверены, что хотите удалить этот товар?');">
                            <button type="submit" class="btn btn-danger px-4">Удалить товар</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
