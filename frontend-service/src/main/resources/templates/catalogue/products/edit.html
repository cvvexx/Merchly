<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование &laquo;[[${product.title}]]&raquo;</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="mb-3">
                <a class="text-decoration-none text-secondary"
                   th:href="@{/catalogue/products/{productId}(productId=${product.id})}">&larr; Вернуться к товару</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark py-3">
                    <h3 class="card-title h5 mb-0 text-center fw-bold">Редактирование товара</h3>
                </div>
                <div class="card-body p-4">

                    <div class="alert alert-danger" role="alert" th:if="${errors}">
                        <h5 class="alert-heading small fw-bold">Ошибки формы:</h5>
                        <ul class="mb-0 px-3 small">
                            <li th:each="error: ${errors}" th:text="${error}"></li>
                        </ul>
                    </div>

                    <form method="post" th:action="@{/catalogue/products/{productId}/edit(productId=${product.id})}" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Название товара</label>
                            <input class="form-control" name="title"
                                   th:value="${payload != null ? payload.title : product.title}" type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Цена</label>
                            <div class="input-group">
                                <span class="input-group-text">₽</span>
                                <input class="form-control" min="0.01"
                                       name="price" placeholder="0.00" required step="0.01"
                                       th:value="${payload != null ? payload.price : product.price()}"
                                       type="number">
                            </div>
                            <div class="form-text">Цена должна быть больше нуля.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Описание</label>
                            <textarea class="form-control"
                                      name="description" rows="4"
                                      th:text="${payload != null ? payload.description : product.description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label fw-bold">Новое изображение товара</label>
                            <input class="form-control"
                                   type="file"
                                   id="image"
                                   name="image"
                                   accept="image/png, image/jpeg, image/webp"
                                   onchange="validateFileSize(this)">
                            <div id="fileSizeError" class="text-danger small mt-1 d-none">
                                Размер файла не должен превышать 10 МБ.
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-warning fw-bold" type="submit">Сохранить изменения</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>

<script>
    function validateFileSize(input) {
        const maxSizeBytes = 10 * 1024 * 1024; // 10 MB
        const errorDiv = document.getElementById('fileSizeError');
        const submitBtn = input.form.querySelector('button[type="submit"]');

        if (input.files && input.files[0]) {
            if (input.files[0].size > maxSizeBytes) {
                errorDiv.classList.remove('d-none');
                input.value = '';
                submitBtn.disabled = true;
            } else {
                errorDiv.classList.add('d-none');
                submitBtn.disabled = false;
            }
        }
    }
</script>

</html>
