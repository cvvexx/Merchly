<!DOCTYPE html>
<html lang="ru" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .product-card-img-wrapper {
            height: 220px;
            overflow: hidden;
            background-color: #f8f9fa;
        }
        .product-card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .creator-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }
        .rating-block {
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-light">

<!-- Навигация -->
<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>

        <div class="d-flex align-items-center gap-2">
            <!-- Кнопки корзины и профиля -->
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-dark m-0">Каталог товаров</h1>
        <a class="btn btn-success" sec:authorize="hasRole('ADMIN')" th:href="@{/catalogue/products/create}">+ Добавить товар</a>
    </div>

    <!-- Поиск / Фильтр -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form class="row g-2 align-items-center" method="get" th:action="@{/catalogue/products/list}">
                <div class="col-sm-9">
                    <input class="form-control" name="filter" placeholder="Поиск по названию..." th:value="${filter}" type="text">
                </div>
                <div class="col-sm-3 d-grid">
                    <button class="btn btn-primary" type="submit">Найти</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Сетка товаров -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <!-- Блок, если товаров нет -->
        <div th:if="${products.isEmpty()}" class="col-12">
            <div class="alert alert-info text-center">
                Товары не найдены.
            </div>
        </div>

        <div class="col" th:each="item : ${products}">
            <div class="card h-100 shadow-sm border-0">
                <!-- Картинка товара -->
                <div class="product-card-img-wrapper rounded-top">
                    <img th:src="@{${item.productImageUrl}}" class="card-img-top" alt="Изображение товара">
                </div>

                <div class="card-body d-flex flex-column">
                    <!-- Мета / Создатель -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted small">ID: <span th:text="${item.product.id}"></span></span>

                        <div class="d-flex align-items-center gap-1">
                            <img th:src="@{${item.userAvatarUrl}}" class="creator-avatar border" alt="Аватар автора">
                            <span class="text-muted small">
                                <span class="fw-bold" th:text="${item.user != null ? item.user.username : 'Неизвестен'}"></span>
                            </span>
                        </div>
                    </div>

                    <!-- Рейтинг и отзывы (НОВЫЙ БЛОК) -->
                    <div class="mb-2 rating-block">
                        <th:block th:if="${item.reviewsCount > 0}">
                            <i class="bi bi-star-fill text-warning"></i>
                            <span class="fw-bold" th:text="${#numbers.formatDecimal(item.averageRating, 1, 1)}">4.5</span>
                            <span class="text-muted ms-1" th:text="'(' + ${item.reviewsCount} + ')'">(12)</span>
                        </th:block>
                        <th:block th:if="${item.reviewsCount == 0}">
                            <i class="bi bi-star text-muted"></i>
                            <span class="text-muted ms-1">Нет отзывов</span>
                        </th:block>
                    </div>

                    <!-- Цена -->
                    <div class="mb-2">
                        <span class="text-muted small">Цена: </span>
                        <span class="fw-bold fs-5 text-success" th:text="${#numbers.formatDecimal(item.product.price, 1, 'WHITESPACE', 2, 'POINT')} + ' ₽'">0.00 ₽</span>
                    </div>

                    <!-- Название и описание -->
                    <h5 class="card-title fw-bold text-dark" th:text="${item.product.title}">Название товара</h5>
                    <p class="card-text text-muted flex-grow-1"
                       th:text="${item.product.description != null ? #strings.abbreviate(item.product.description, 100) : 'Описание отсутствует...'}"></p>

                    <!-- Кнопки действий -->
                    <div class="mt-3 d-flex gap-2">
                        <a class="btn btn-outline-primary flex-grow-1" th:href="@{/catalogue/products/{productId}(productId=${item.product.id})}">
                            Подробнее
                        </a>

                        <button class="btn btn-success"
                                type="button"
                                th:data-product-id="${item.product.id}"
                                onclick="addToCart(this)">
                            <i class="bi bi-bag-plus"></i> В корзину
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS скрипт для добавления AJAX запросом в корзину -->
<script>
    async function addToCart(buttonElement) {
        const productId = buttonElement.getAttribute('data-product-id');
        const originalText = buttonElement.innerHTML;

        buttonElement.disabled = true;
        buttonElement.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        // Получаем CSRF-токены из meta-тегов
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const headers = {
            'Content-Type': 'application/json'
        };

        // Прокидываем CSRF-заголовок, если он присутствует в DOM
        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }

        try {
            const response = await fetch('/cart/add', {
                method: 'POST',
                headers: headers, // Используем сформированные заголовки
                body: JSON.stringify({
                    productId: productId,
                    quantity: 1
                })
            });

            if (response.ok) {
                buttonElement.className = 'btn btn-outline-success';
                buttonElement.innerHTML = '<i class="bi bi-check2"></i> В корзине';

                setTimeout(() => {
                    buttonElement.className = 'btn btn-success';
                    buttonElement.innerHTML = originalText;
                    buttonElement.disabled = false;
                }, 1500);
            } else {
                alert('Не удалось добавить товар в корзину');
                buttonElement.disabled = false;
                buttonElement.innerHTML = originalText;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            alert('Произошла ошибка сети');
            buttonElement.disabled = false;
            buttonElement.innerHTML = originalText;
        }
    }
</script>

</body>
</html>
