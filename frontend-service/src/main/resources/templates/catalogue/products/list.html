<!DOCTYPE html>
<html lang="ru" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-dark m-0">Каталог товаров</h1>
        <a class="btn btn-success" sec:authorize="hasRole('ADMIN')" th:href="@{/catalogue/products/create}">+ Добавить
            товар</a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form class="row g-2 align-items-center" method="get" th:action="@{/catalogue/products/list}">
                <div class="col-sm-9">
                    <input class="form-control" name="filter" placeholder="Поиск по названию..." th:value="${filter}"
                           type="text">
                </div>
                <div class="col-sm-3 d-grid">
                    <button class="btn btn-primary" type="submit">Найти</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <!-- ТЕПЕРЬ ИСПОЛЬЗУЕМ item, ТАК КАК В СПИСКЕ ЛЕЖАТ ProductOwnerViewModel -->
        <div class="col" th:each="item : ${products}">
            <div class="card h-100 shadow-sm border-0">
                <!-- Добавлено изображение с проверкой на null -->
                <img th:src="@{${item.imageUrl}}" class="card-img-top" alt="Изображение товара">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between">
                        <span class="text-muted small">ID: <span th:text="${item.product.id}"></span></span>
                        <span class="text-muted small">Продавец: <span class="fw-bold"
                                                                       th:text="${item.user != null ? item.user.username : 'Неизвестен'}"></span></span>
                    </div>
                    <span class="text-muted small">Цена: <span class="fw-bold"
                                                               th:text="${item.product().price()}"></span></span>

                    <h5 class="card-title fw-bold mt-1 text-dark" th:text="${item.product.title}">Товар</h5>
                    <p class="card-text text-muted flex-grow-1"
                       th:text="${item.product.description != null ? #strings.abbreviate(item.product.description, 100) : 'Описание отсутствует...'}"></p>

                    <div class="mt-3">
                        <a class="btn btn-outline-primary w-100"
                           th:href="@{/catalogue/products/{productId}(productId=${item.product.id})}">Подробнее</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
