<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый товар &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="mb-3">
                <a th:href="@{/catalogue/products/list}" class="text-decoration-none text-secondary">&larr; В каталог</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h3 class="card-title h5 mb-0 text-center">Создание нового товара</h3>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errors}" class="alert alert-danger" role="alert">
                        <h5 class="alert-heading small fw-bold">Возникли ошибки:</h5>
                        <ul class="mb-0 px-3 small">
                            <li th:each="error: ${errors}" th:text="${error}"></li>
                        </ul>
                    </div>

                    <form th:action="@{/catalogue/products/create}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Название товара</label>
                            <input th:value="${payload?.title}" name="title" type="text" class="form-control" placeholder="Введите название...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Описание</label>
                            <textarea th:text="${payload?.description}" name="description" class="form-control" rows="4" placeholder="Опишите свойства товара..."></textarea>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success">Создать товар</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
