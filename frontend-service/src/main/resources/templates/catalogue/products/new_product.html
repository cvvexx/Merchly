<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый товар &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="mb-3">
                <a class="text-decoration-none text-secondary" th:href="@{/catalogue/products/list}">&larr; В
                    каталог</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h3 class="card-title h5 mb-0 text-center">Создание нового товара</h3>
                </div>
                <div class="card-body p-4">

                    <div class="alert alert-danger" role="alert" th:if="${errors}">
                        <h5 class="alert-heading small fw-bold">Ошибки валидации:</h5>
                        <ul class="mb-0 px-3 small">
                            <li th:each="error: ${errors}" th:text="${error}"></li>
                        </ul>
                    </div>

                    <form enctype="multipart/form-data" method="post" th:action="@{/catalogue/products/create}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Название товара</label>
                            <input class="form-control" name="title" placeholder="Введите название..."
                                   th:value="${payload?.title}" type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Цена</label>
                            <div class="input-group">
                                <span class="input-group-text">₽</span>
                                <input class="form-control" min="0.01" name="price" placeholder="0.00" required
                                       step="0.01" th:value="${payload?.price}" type="number">
                            </div>
                            <div class="form-text">Цена должна быть больше нуля.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Описание</label>
                            <textarea class="form-control" name="description" placeholder="Введите описание товара..."
                                      rows="4" th:text="${payload?.description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Количество</label>
                            <div class="input-group">
                                <input class="form-control" min="0" name="quantity" placeholder="0" required
                                       step="1" th:value="${payload?.quantity}" type="number">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold" for="image">Изображение товара</label>
                            <input accept="image/png, image/jpeg, image/webp"
                                   class="form-control"
                                   id="image"
                                   name="image"
                                   onchange="validateFileSize(this)"
                                   type="file">
                            <div class="text-danger small mt-1 d-none" id="fileSizeError">
                                Размер файла не должен превышать 10 МБ.
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-success" type="submit">Создать товар</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    function validateFileSize(input) {
        const maxSizeBytes = 10 * 1024 * 1024; // 10 MB
        const errorDiv = document.getElementById('fileSizeError');

        // Безопасный поиск кнопки submit
        const form = input.form || input.closest('form');
        const submitBtn = form ? form.querySelector('button[type="submit"]') : null;

        if (input.files && input.files[0]) {
            if (input.files[0].size > maxSizeBytes) {
                if (errorDiv) errorDiv.classList.remove('d-none');
                input.value = ''; // Сбрасываем выбранный файл
                if (submitBtn) submitBtn.disabled = true;
            } else {
                if (errorDiv) errorDiv.classList.add('d-none');
                if (submitBtn) submitBtn.disabled = false;
            }
        }
    }
</script>
</html>
