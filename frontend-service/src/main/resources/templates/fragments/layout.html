<!DOCTYPE html>
<html lang="ru" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<!-- =========================================================================
     Общие фрагменты Merchly.
     Навигация, шапка и скрипты собраны здесь, чтобы набор разделов и размеры
     кнопок были одинаковыми на всех страницах.

     Использование на странице:
       <head th:replace="~{fragments/layout :: head('Заголовок')}"></head>
       <nav  th:replace="~{fragments/layout :: topbar('catalogue')}"></nav>
       ... содержимое ...
       <nav  th:replace="~{fragments/layout :: dock('catalogue')}"></nav>
       <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

     Значения раздела: catalogue | orders | cart | profile | none
     ========================================================================= -->

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <!-- Мета-теги для защиты CSRF в Spring Security -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <title th:text="${pageTitle} + ' — Merchly'">Merchly</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <!-- Флаг ставится до отрисовки: без скриптов содержимое видно сразу,
         со скриптами блоки проявляются при прокрутке. Если merchly.js не
         загрузился, флаг снимается — контент не должен остаться невидимым. -->
    <script>
        document.documentElement.classList.add('js-motion');
        setTimeout(function () {
            if (!window.Merchly) {
                document.documentElement.classList.remove('js-motion');
            }
        }, 2500);
    </script>
</head>

<body>

<!-- ============================ Верхняя панель ============================ -->
<nav class="top-rail" th:fragment="topbar(active)">
    <div class="container top-rail__inner">

        <a class="rail-brand" th:href="@{/}">
            <span aria-hidden="true" class="rail-brand__dot"></span>
            Merchly
        </a>

        <div class="rail-nav">
            <a class="rail-link"
               th:classappend="${active == 'catalogue'} ? 'is-active'"
               th:href="@{/catalogue/products/list}">Каталог</a>

            <a class="rail-link" sec:authorize="isAuthenticated()"
               th:classappend="${active == 'orders'} ? 'is-active'"
               th:href="@{/orders}">Мои заказы</a>
        </div>

        <div class="rail-actions">
            <!-- Корзина: цель «полёта» товара и место, где живёт счётчик -->
            <a class="rail-btn cart-pill" sec:authorize="isAuthenticated()"
               th:classappend="${active == 'cart'} ? 'rail-btn--solid'"
               th:href="@{/cart}">
                <i aria-hidden="true" class="bi bi-bag"></i>
                <span class="rail-btn__label">Корзина</span>
                <span class="cart-count" data-cart-count hidden>0</span>
            </a>

            <a class="rail-btn" sec:authorize="isAuthenticated()"
               th:classappend="${active == 'profile'} ? 'rail-btn--solid'"
               th:href="@{/profile}">
                <i aria-hidden="true" class="bi bi-person"></i>
                <span class="rail-btn__label">Профиль</span>
            </a>

            <a class="rail-btn rail-btn--solid" sec:authorize="isAnonymous()" th:href="@{/login}">Войти</a>
        </div>

    </div>
</nav>

<!-- ===================== Нижний док (узкие экраны) ======================== -->
<nav aria-label="Разделы" class="dock" th:fragment="dock(active)">

    <a class="dock__item" th:classappend="${active == 'catalogue'} ? 'is-active'"
       th:href="@{/catalogue/products/list}">
        <i aria-hidden="true" class="bi bi-grid"></i>
        <span>Каталог</span>
    </a>

    <a class="dock__item" sec:authorize="isAuthenticated()"
       th:classappend="${active == 'cart'} ? 'is-active'" th:href="@{/cart}">
        <i aria-hidden="true" class="bi bi-bag"></i>
        <span>Корзина</span>
        <span class="dock__badge" data-cart-count hidden>0</span>
    </a>

    <a class="dock__item" sec:authorize="isAuthenticated()"
       th:classappend="${active == 'orders'} ? 'is-active'" th:href="@{/orders}">
        <i aria-hidden="true" class="bi bi-receipt"></i>
        <span>Заказы</span>
    </a>

    <a class="dock__item" sec:authorize="isAuthenticated()"
       th:classappend="${active == 'profile'} ? 'is-active'" th:href="@{/profile}">
        <i aria-hidden="true" class="bi bi-person"></i>
        <span>Профиль</span>
    </a>

    <a class="dock__item" sec:authorize="isAnonymous()" th:href="@{/login}">
        <i aria-hidden="true" class="bi bi-box-arrow-in-right"></i>
        <span>Войти</span>
    </a>

</nav>

<!-- ============================== Скрипты ================================ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/merchly.js}"></script>
</th:block>

</body>
</html>
