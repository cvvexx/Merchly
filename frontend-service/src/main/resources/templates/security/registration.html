<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="col-md-4">

        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none h2 fw-bold text-primary">Merchly</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Регистрация</h3>

                <form method="post" th:action="@{/do-register}">
                    <input name="target" th:value="${target}" type="hidden"/>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Придумайте логин</label>
                        <input name="username" placeholder="Например, ivan_merch" required type="text" class="form-control form-control-lg fs-6"/>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Придумайте пароль</label>
                        <input name="password" placeholder="Минимум 6 символов" required type="password" class="form-control form-control-lg fs-6"/>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm mb-3">Зарегистрироваться</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted small">Уже есть аккаунт?</span>
                    <a th:href="@{/login(target=${target})}" class="text-decoration-none small fw-bold text-success">Войти в кабинет</a>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/}" class="text-muted small text-decoration-none">&larr; Отмена</a>
        </div>
    </div>
</div>

</body>
</html>
