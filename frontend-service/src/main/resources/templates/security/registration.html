<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Регистрация &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <a th:href="@{/profile}" class="btn btn-outline-info btn-sm">В профиль</a>
    </div>
</nav>

<div class="container my-5 d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="col-md-5 col-lg-4">

        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none h2 fw-bold text-primary">Merchly</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Регистрация</h3>

                <!-- Блок для вывода списка ошибок 400 Bad Request -->
                <div class="alert alert-danger py-2 small" th:if="${errors}">
                    <ul class="mb-0 ps-3">
                        <li th:each="error : ${errors}" th:text="${error}"></li>
                    </ul>
                </div>

                <form method="post" th:action="@{/do-register}">
                    <input name="target" th:value="${target}" type="hidden"/>

                    <!-- Логин -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Имя пользователя</label>
                        <input name="username"
                               th:value="${payload != null ? payload.username : ''}"
                               placeholder="..." required type="text" class="form-control fs-6"/>
                    </div>

                    <!-- Пароль -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Придумайте пароль</label>
                        <input name="password" placeholder="Минимум 8 символов" required type="password" class="form-control fs-6"/>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Электронная почта</label>
                        <input name="email"
                               th:value="${payload != null ? payload.email : ''}"
                               placeholder="example@mail.com" required type="email" class="form-control fs-6"/>
                    </div>

                    <!-- Пол -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Пол</label>
                        <select name="gender" required class="form-select fs-6">
                            <option value="" disabled th:selected="${payload == null || payload.gender == null}">Выберите пол...</option>
                            <option value="M" th:selected="${payload != null && payload.gender == 'M'}">Мужской</option>
                            <option value="F" th:selected="${payload != null && payload.gender == 'F'}">Женский</option>
                        </select>
                    </div>

                    <!-- Дата рождения -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Дата рождения</label>
                        <input name="birthDate"
                               th:value="${payload != null ? payload.birthDate : ''}"
                               required type="date" class="form-control fs-6"/>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mb-3">Зарегистрироваться</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted small">Уже есть аккаунт?</span>
                    <a th:href="@{/login(target=${target})}" class="text-decoration-none small fw-bold text-primary">Войти в аккаунт</a>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/}" class="text-muted small text-decoration-none">&larr; Назад</a>
        </div>
    </div>
</div>

</body>
</html>
