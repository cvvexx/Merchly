<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Регистрация')}"></head>
<body>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-6 col-xl-5">

            <div class="text-center mb-4">
                <a class="rail-brand text-dark" th:href="@{/}">
                    <span aria-hidden="true" class="rail-brand__dot"></span>
                    Merchly
                </a>
            </div>

            <div class="card shadow border-0 reveal">
                <div class="card-body p-4">
                    <h1 class="h4 text-center mb-2 fw-bold">Создать аккаунт</h1>
                    <p class="text-muted small text-center mb-4">Займёт минуту. Аватар можно добавить позже.</p>

                    <div class="alert alert-danger mb-4"
                         th:if="${param.error != null and param.error[0] == 'rate_limited'}">
                        Слишком много попыток регистрации. Подождите и попробуйте снова.
                    </div>

                    <div class="alert alert-danger mb-4" th:if="${errors != null}">
                        <ul class="mb-0 ps-3">
                            <li th:each="err : ${errors}" th:text="${err}">Ошибка валидации</li>
                        </ul>
                    </div>

                    <form enctype="multipart/form-data" id="registrationForm" method="post" th:action="@{/do-register}">
                        <input th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                               type="hidden"/>
                        <input name="target" th:value="${target}" type="hidden"/>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label eyebrow" for="firstName">Имя</label>
                                <input class="form-control form-control-lg fs-6" id="firstName" name="firstName"
                                       placeholder="Иван" required
                                       th:value="${payload != null ? payload.firstName : ''}" type="text"/>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label eyebrow" for="lastName">Фамилия</label>
                                <input class="form-control form-control-lg fs-6" id="lastName" name="lastName"
                                       placeholder="Иванов" required
                                       th:value="${payload != null ? payload.lastName : ''}" type="text"/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label eyebrow" for="username">Имя пользователя (логин)</label>
                            <input autocomplete="username" class="form-control form-control-lg fs-6" id="username"
                                   name="username" placeholder="ivan_merch" required
                                   th:value="${payload != null ? payload.username : ''}" type="text"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label eyebrow" for="email">Email</label>
                            <input autocomplete="email" class="form-control form-control-lg fs-6" id="email"
                                   name="email" placeholder="example@mail.com" required
                                   th:value="${payload != null ? payload.email : ''}" type="email"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label eyebrow" for="userAvatar">Аватар</label>
                            <input accept="image/*" class="form-control form-control-lg fs-6" id="userAvatar"
                                   name="userAvatar" type="file"/>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label eyebrow" for="gender">Пол</label>
                                <select class="form-select form-select-lg fs-6" id="gender" name="gender" required>
                                    <option th:selected="${payload != null and payload.gender == 'M'}" value="M">
                                        Мужчина
                                    </option>
                                    <option th:selected="${payload != null and payload.gender == 'F'}" value="F">
                                        Женщина
                                    </option>
                                </select>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label eyebrow" for="birthDate">Дата рождения</label>
                                <input class="form-control form-control-lg fs-6" id="birthDate" name="birthDate"
                                       required th:value="${payload != null ? payload.birthDate : ''}" type="date"/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label eyebrow" for="password">Пароль</label>
                            <input autocomplete="new-password" class="form-control form-control-lg fs-6" id="password"
                                   name="password" placeholder="Минимум 8 символов" required type="password"/>
                        </div>

                        <div class="mb-4">
                            <label class="form-label eyebrow" for="confirmPassword">Повторите пароль</label>
                            <input autocomplete="new-password" class="form-control form-control-lg fs-6"
                                   id="confirmPassword" placeholder="Ещё раз тот же пароль" required type="password"/>
                            <div class="invalid-feedback" id="passwordMismatch">Пароли не совпадают.</div>
                        </div>

                        <button class="btn btn-success btn-lg w-100 mb-3" type="submit">Зарегистрироваться</button>
                    </form>

                    <p class="text-center text-muted small mb-0">
                        Уже есть аккаунт?
                        <a class="text-decoration-none fw-bold" th:href="@{/login(target=${target})}">Войти</a>
                    </p>
                </div>
            </div>

            <p class="text-center mt-4 mb-0">
                <a class="back-link" th:href="@{/}">
                    <span aria-hidden="true" class="back-link__arrow">&larr;</span> На главную
                </a>
            </p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const form = document.getElementById('registrationForm');

        function passwordsMatch() {
            const match = password.value === confirmPassword.value;
            confirmPassword.classList.toggle('is-invalid', !match);
            return match;
        }

        password.addEventListener('change', passwordsMatch);
        confirmPassword.addEventListener('keyup', passwordsMatch);

        form.addEventListener('submit', function (event) {
            if (!passwordsMatch()) {
                event.preventDefault();
                event.stopPropagation();
                confirmPassword.focus();
                Merchly.notify('Пароли не совпадают.', 'error');
            }
        });
    });
</script>

</body>
</html>
