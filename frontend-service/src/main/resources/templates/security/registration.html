<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5 d-flex justify-content-center align-items-center">
    <div class="col-md-5">

        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none h2 fw-bold text-primary">Merchly</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Регистрация</h3>

                <form method="post" th:action="@{/do-register}" id="registrationForm">
                    <!-- CSRF Токен -->
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input name="target" th:value="${target}" type="hidden"/>

                    <!-- Логин -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Имя</label>
                        <input name="firstName" placeholder="ivan" required type="text" class="form-control form-control-lg fs-6"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Фамилия</label>
                        <input name="lastName" placeholder="merch" required type="text" class="form-control form-control-lg fs-6"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Имя пользователя</label>
                        <input name="username" placeholder="ivan_merch" required type="text" class="form-control form-control-lg fs-6"/>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Email</label>
                        <input name="email" placeholder="example@mail.com" required type="email" class="form-control form-control-lg fs-6"/>
                    </div>

                    <!-- Пол и Дата рождения (Кастомные поля для локальной БД) -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Пол</label>
                            <select name="gender" class="form-select form-select-lg fs-6" required>
                                <option value="M">Мужской</option>
                                <option value="F">Женский</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Дата рождения</label>
                            <input name="birthDate" required type="date" class="form-control form-control-lg fs-6"/>
                        </div>
                    </div>

                    <!-- Пароль -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Придумайте пароль</label>
                        <input id="password" name="password" placeholder="Минимум 8 символов" required type="password" class="form-control form-control-lg fs-6"/>
                    </div>

                    <!-- Подтверждение пароля -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Повторите пароль</label>
                        <input id="confirmPassword" placeholder="Повторите введенный пароль" required type="password" class="form-control form-control-lg fs-6"/>
                        <div id="passwordMismatch" class="invalid-feedback">Пароли не совпадают!</div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 shadow-sm mb-3">Зарегистрироваться</button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-muted small">Уже есть аккаунт?</span>
                    <a th:href="@{/login(target=${target})}" class="text-decoration-none small fw-bold text-success">Войти в кабинет</a>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/}" class="text-muted small text-decoration-none">&larr; Отмена</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const form = document.getElementById('registrationForm');

        function validatePassword() {
            if (password.value !== confirmPassword.value) {
                confirmPassword.classList.add('is-invalid');
                return false;
            } else {
                confirmPassword.classList.remove('is-invalid');
                return true;
            }
        }

        password.addEventListener('change', validatePassword);
        confirmPassword.addEventListener('keyup', validatePassword);

        form.addEventListener('submit', function (event) {
            if (!validatePassword()) {
                event.preventDefault();
                event.stopPropagation();
            }
        });
    });
</script>

</body>
</html>
