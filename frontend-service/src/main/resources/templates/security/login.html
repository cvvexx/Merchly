<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в Merchly</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 300px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff4757;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Войти в систему</h2>

    <div style="color: red; background-color: #ffe6e6; padding: 10px; border-radius: 5px; margin-bottom: 15px;"
         th:if="${message}">
        <p th:text="${message}"></p>
    </div>

    <div class="error"
         th:if="${param.error != null && (param.error[0] == 'true' || param.error[0] == 'bad_credentials')}">
        Неверный логин или пароль!
    </div>

    <div style="color: #2ed573; margin-bottom: 15px;" th:if="${param.logout}">
        Вы успешно вышли.
    </div>

    <form method="post" th:action="@{/do-login}">
        <input name="target" th:value="${target}" type="hidden"/>
        <div class="input-group">
            <label>Логин (Email)</label>
            <label>
                <input name="username" placeholder="Введите логин..." required type="text"/>
            </label>
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <label>
                <input name="password" placeholder="Пароль..." required type="password"/>
            </label>
        </div>
        <button type="submit">Войти</button>
    </form>
    <div style="margin-top: 15px; text-align: center; font-size: 14px;">
        Нет аккаунта? <a style="color: #2ed573; text-decoration: none;" th:href="@{/registration(target=${target})}">Зарегистрироваться</a>
    </div>
</div>

</body>
</html>
