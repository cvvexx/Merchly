<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${profile.username})}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar('catalogue')}"></nav>

<main class="container my-4 my-lg-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="mb-3">
                <a class="back-link" th:href="@{/catalogue/products/list}">
                    <span class="back-link__arrow" aria-hidden="true">&larr;</span> Вернуться в каталог
                </a>
            </div>

            <div class="card shadow border-0 reveal">
                <div class="header-bg"></div>

                <div class="card-body text-center pb-4">
                    <img alt="" class="profile-avatar bg-white" style="margin-top: -75px;"
                         th:src="@{${userAvatarUrl}}">

                    <h1 class="h4 fw-bold mb-1 mt-3" th:text="${profile.username}">Username</h1>
                    <p class="eyebrow mb-4">Автор Merchly</p>

                    <div class="row g-3 text-start">
                        <div class="col-6">
                            <span class="eyebrow"><i aria-hidden="true" class="bi bi-person-fill"></i> Пол</span>
                            <span class="field-row__value"
                                  th:text="${profile.gender == 'M' ? 'Мужской' : (profile.gender == 'F' ? 'Женский' : 'Не указан')}">
                                Мужской
                            </span>
                        </div>

                        <div class="col-6">
                            <span class="eyebrow"><i aria-hidden="true" class="bi bi-calendar-event-fill"></i> Дата рождения</span>
                            <span class="field-row__value mono"
                                  th:text="${profile.birthDate != null ? #temporals.format(profile.birthDate, 'dd.MM.yyyy') : 'Не указана'}">
                                01.01.2000
                            </span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<nav th:replace="~{fragments/layout :: dock('catalogue')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
