<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профиль пользователя [[${profile.username}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .profile-avatar {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        .header-bg {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
            height: 120px;
            border-radius: 0.375rem 0.375rem 0 0;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0 mt-3">
                <div class="header-bg"></div>
                <div class="card-body text-center position-relative pb-5">

                    <!-- Аватарка (с заглушкой, если аватарки нет) -->
                    <img alt="Аватар"
                         class="profile-avatar bg-white mt-n5 position-relative top-0 start-50 translate-middle-x"
                         style="margin-top: -75px;" th:src="@{${userAvatarUrl}}">

                    <!-- Имя пользователя -->
                    <h3 class="fw-bold mb-1" th:text="${profile.username}">Username</h3>
                    <p class="text-muted mb-4">На сайте с 2024 года</p> <!-- Можешь добавить дату регистрации позже -->

                    <!-- Инфо-блок -->
                    <div class="d-flex justify-content-center gap-4 text-start">
                        <!-- Пол -->
                        <div>
                            <span class="text-muted small text-uppercase fw-bold"><i class="bi bi-person-fill"></i> Пол</span>
                            <h6 class="mb-0 mt-1" th:text="${profile.gender != null ? profile.gender : 'Не указан'}">
                                Мужской</h6>
                        </div>

                        <!-- Разделитель -->
                        <div class="border-start"></div>

                        <!-- Дата рождения -->
                        <div>
                            <span class="text-muted small text-uppercase fw-bold"><i
                                    class="bi bi-calendar-event-fill"></i> Дата рождения</span>
                            <h6 class="mb-0 mt-1"
                                th:text="${profile.birthDate != null ? #temporals.format(profile.birthDate, 'dd MMMM yyyy') : 'Не указана'}">
                                01 января 2000</h6>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Кнопка назад -->
            <div class="text-center mt-4">
                <a class="text-decoration-none text-secondary" th:href="@{/catalogue/products/list}">&larr; Вернуться в
                    каталог</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
