<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Профиль')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar('profile')}"></nav>

<main class="container my-4 my-lg-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">

            <div class="card shadow border-0 reveal">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h1 class="h4 mb-0 fw-bold text-white">Профиль пользователя</h1>
                </div>

                <div class="card-body p-4">

                    <div class="avatar-wrapper shadow-sm">
                        <img alt="Ваш аватар" th:src="@{${userAvatar}}">
                    </div>

                    <div class="field-row">
                        <span class="eyebrow">Имя пользователя</span>
                        <span class="field-row__value" th:text="${user.username}">ivan_ivanov</span>
                    </div>

                    <div class="field-row">
                        <span class="eyebrow">Email</span>
                        <span class="field-row__value" th:text="${user.email}">user@example.com</span>
                    </div>

                    <div class="field-row">
                        <span class="eyebrow">Пол</span>
                        <span class="field-row__value"
                              th:text="${user.gender == 'M' ? 'Мужской' : (user.gender == 'F' ? 'Женский' : 'Не указан')}">
                            Мужской
                        </span>
                    </div>

                    <div class="field-row">
                        <span class="eyebrow">Дата рождения</span>
                        <span class="field-row__value mono"
                              th:text="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd.MM.yyyy') : 'Не указана'}">
                            01.01.2000
                        </span>
                    </div>

                    <div class="field-row">
                        <span class="eyebrow">Права доступа</span>
                        <span class="d-block mt-2">
                            <th:block th:each="auth : ${user.roles}">
                                <span class="badge bg-success me-1"
                                      th:if="${!auth.contains('default-roles') && !auth.contains('uma_authorization') && !auth.contains('offline_access')}"
                                      th:text="${#strings.replace(auth, 'ROLE_', '')}">USER</span>
                            </th:block>
                        </span>
                    </div>

                    <!-- Действия над аккаунтом: одинаковый размер, один ряд -->
                    <div class="d-flex flex-wrap gap-2 mt-4 pt-3 border-top">
                        <a class="btn btn-primary" th:href="@{/profile/edit}">
                            <i aria-hidden="true" class="bi bi-pencil"></i> Изменить профиль
                        </a>
                        <a class="btn btn-outline-primary" th:href="@{/orders}">
                            <i aria-hidden="true" class="bi bi-receipt"></i> Мои заказы
                        </a>

                        <form class="m-0 ms-auto" method="post" th:action="@{/logout}">
                            <button class="btn btn-outline-danger" type="submit">Выйти из аккаунта</button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<nav th:replace="~{fragments/layout :: dock('profile')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
