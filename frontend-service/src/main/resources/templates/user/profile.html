<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <title>Профиль пользователя &ndash; Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .avatar-wrapper {
            width: 120px;
            height: 120px;
            overflow: hidden;
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            border: 3px solid #0d6efd;
            background-color: #f8f9fa;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info" th:href="@{/orders}">Мои заказы</a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0 fw-bold">Профиль пользователя</h3>
                </div>
                <div class="card-body p-4">

                    <!-- Аватар пользователя -->
                    <div class="avatar-wrapper shadow-sm">
                        <img alt="Аватар пользователя" th:src="@{${userAvatar}}">
                    </div>

                    <!-- Имя пользователя -->
                    <div class="mb-3 border-bottom pb-2">
                        <span class="text-muted d-block small text-uppercase">Имя пользователя (Логин)</span>
                        <strong class="fs-5 text-dark" th:text="${user.username}">ivan_ivanov</strong>
                    </div>

                    <!-- Email -->
                    <div class="mb-3 border-bottom pb-2">
                        <span class="text-muted d-block small text-uppercase">Email адрес</span>
                        <strong class="fs-5 text-dark" th:text="${user.email}">user@example.com</strong>
                    </div>

                    <!-- Пол -->
                    <div class="mb-3 border-bottom pb-2">
                        <span class="text-muted d-block small text-uppercase">Пол</span>
                        <strong class="fs-5 text-dark"
                                th:text="${user.gender == 'M' ? 'Мужской' : (user.gender == 'F' ? 'Женский' : user.gender)}">
                            Мужской
                        </strong>
                    </div>

                    <!-- Дата рождения -->
                    <div class="mb-3 border-bottom pb-2">
                        <span class="text-muted d-block small text-uppercase">Дата рождения</span>
                        <strong class="fs-5 text-dark"
                                th:text="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd.MM.yyyy') : 'Не указана'}">
                            01.01.2000
                        </strong>
                    </div>

                    <!-- Роли -->
                    <div class="mb-4">
                        <span class="text-muted d-block mb-1 small text-uppercase">Роли / Права доступа</span>
                        <div>
                            <th:block th:each="auth : ${user.roles}">
                                <span class="badge bg-success me-1 fs-6"
                                      th:if="${!auth.contains('default-roles') && !auth.contains('uma_authorization') && !auth.contains('offline_access')}"
                                      th:text="${#strings.replace(auth, 'ROLE_', '')}">
                                    USER
                                </span>
                            </th:block>
                        </div>
                    </div>

                    <!-- Кнопки управления -->
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <div class="btn-group gap-2">
                            <a class="btn btn-outline-primary" href="/">На главную</a>
                            <a class="btn btn-outline-secondary" href="/catalogue/products/list">В каталог</a>
                            <a class="btn btn-outline-primary" href="/profile/edit">Изменить профиль</a>
                        </div>

                        <form class="m-0" method="post" th:action="@{/logout}">
                            <button class="btn btn-danger" type="submit">Выйти из аккаунта</button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
