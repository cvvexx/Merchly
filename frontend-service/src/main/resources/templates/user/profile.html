<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">Профиль пользователя</h3>
                </div>
                <div class="card-body">

                    <div class="mb-3 border-bottom pb-2">
                        <span class="text-muted d-block">ID аккаунта:</span>
                        <strong class="fs-5" th:text="${user.id}">123</strong>
                    </div>

                    <div class="mb-3 border-bottom pb-2">
                        <span class="text-muted d-block">Имя пользователя (Логин):</span>
                        <strong class="fs-5" th:text="${user.username}">ivan_ivanov</strong>
                    </div>

                    <div class="mb-4">
                        <span class="text-muted d-block mb-1">Ваши роли / Права доступа:</span>
                        <div>
                            <div>
                                <span th:each="auth : ${user.roles}"
                                      th:text="${auth}"
                                      class="badge bg-success me-1 fs-6">
                                    ROLE_USER
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="/catalogue/products" class="btn btn-outline-secondary">В каталог</a>

                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-danger">Выйти из аккаунта</button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
