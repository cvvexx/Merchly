<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <title>Редактирование профиля – Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .avatar-preview-wrapper {
            width: 120px;
            height: 120px;
            overflow: hidden;
            border-radius: 50%;
            margin: 0 auto 1rem auto;
            border: 3px solid #0d6efd;
            background-color: #f8f9fa;
        }

        .avatar-preview-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0 fw-bold">Редактирование профиля</h3>
                </div>

                <div class="card-body p-4">

                    <!-- Блок отображения ошибок валидации -->
                    <div class="alert alert-danger mb-4" th:if="${errors != null}">
                        <ul class="mb-0 ps-3">
                            <li th:each="err : ${errors}" th:text="${err}">Ошибка валидации</li>
                        </ul>
                    </div>

                    <form enctype="multipart/form-data" id="profileForm" method="post" th:action="@{/profile/edit}">

                        <!-- Аватарка -->
                        <div class="text-center mb-4">
                            <div class="avatar-preview-wrapper shadow-sm">
                                <img alt="Аватар пользователя"
                                     id="userAvatar"
                                     th:src="@{${userAvatar}}">
                            </div>

                            <label class="form-label text-muted small text-uppercase fw-bold" for="avatarInput">
                                Изменить аватар (до 10 МБ)
                            </label>
                            <input accept="image/*"
                                   class="form-control"
                                   id="avatarInput"
                                   name="userAvatar"
                                   onchange="validateAndPreviewAvatar(this)"
                                   type="file">

                            <div class="invalid-feedback d-none" id="avatarError">
                                Размер файла не должен превышать 10 МБ!
                            </div>
                        </div>

                        <!-- Имя пользователя (Username) -->
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold" for="username">
                                Имя пользователя (логин)
                            </label>
                            <input class="form-control"
                                   id="username"
                                   name="username"
                                   required
                                   th:value="${payload != null ? payload.username : user.username}"
                                   type="text">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold" for="email">
                                Email адрес
                            </label>
                            <input class="form-control"
                                   id="email"
                                   name="email"
                                   required
                                   th:value="${payload != null ? payload.email : user.email}"
                                   type="email">
                        </div>

                        <!-- Пол -->
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold" for="gender">
                                Пол
                            </label>
                            <select class="form-select" id="gender" name="gender">
                                <option th:selected="${payload != null ? payload.gender == null : user.gender == null}"
                                        value="">
                                    Не указан
                                </option>
                                <option th:selected="${payload != null ? payload.gender == 'M' : user.gender == 'M'}"
                                        value="M">
                                    Мужчина
                                </option>
                                <option th:selected="${payload != null ? payload.gender == 'F' : user.gender == 'F'}"
                                        value="F">
                                    Женщина
                                </option>
                            </select>
                        </div>

                        <!-- Дата рождения -->
                        <div class="mb-4">
                            <label class="form-label text-muted small text-uppercase fw-bold" for="birthDate">
                                Дата рождения
                            </label>
                            <input class="form-control"
                                   id="birthDate"
                                   name="birthDate"
                                   th:value="${payload != null ? payload.birthDate : user.birthDate}"
                                   type="date">
                        </div>

                        <!-- Кнопки -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a class="btn btn-outline-secondary" th:href="@{/profile}">Отмена</a>
                            <button class="btn btn-success px-4" id="submitBtn" type="submit">
                                Сохранить изменения
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function validateAndPreviewAvatar(input) {
        const errorDiv = document.getElementById('avatarError');
        const submitBtn = document.getElementById('submitBtn');
        const preview = document.getElementById('userAvatar');
        const maxSizeBytes = 10 * 1024 * 1024; // 10 MB

        if (input.files && input.files[0]) {
            const file = input.files[0];

            if (file.size > maxSizeBytes) {
                input.classList.add('is-invalid');
                if (errorDiv) {
                    errorDiv.classList.remove('d-none');
                    errorDiv.classList.add('d-block');
                }
                if (submitBtn) submitBtn.disabled = true;
                input.value = ''; // Очищаем инпут с некорректным файлом
                return;
            } else {
                input.classList.remove('is-invalid');
                if (errorDiv) {
                    errorDiv.classList.remove('d-block');
                    errorDiv.classList.add('d-none');
                }
                if (submitBtn) submitBtn.disabled = false;
            }

            // Превью изображения
            if (preview) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    }
</script>

</body>
</html>
