<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Редактирование профиля')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar('profile')}"></nav>

<main class="container my-4 my-lg-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">

            <div class="mb-3">
                <a class="back-link" th:href="@{/profile}">
                    <span aria-hidden="true" class="back-link__arrow">&larr;</span> К профилю
                </a>
            </div>

            <div class="card shadow border-0 reveal">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h1 class="h4 mb-0 fw-bold text-white">Редактирование профиля</h1>
                </div>

                <div class="card-body p-4">

                    <div class="alert alert-danger mb-4" th:if="${errors != null}">
                        <ul class="mb-0 ps-3">
                            <li th:each="err : ${errors}" th:text="${err}">Ошибка валидации</li>
                        </ul>
                    </div>

                    <form enctype="multipart/form-data" id="profileForm" method="post" th:action="@{/profile/edit}">

                        <div class="text-center mb-4">
                            <div class="avatar-preview-wrapper shadow-sm">
                                <img alt="Ваш аватар" id="userAvatar" th:src="@{${userAvatar}}">
                            </div>

                            <label class="form-label eyebrow" for="avatarInput">Аватар — до 10 МБ</label>
                            <input accept="image/*" class="form-control" id="avatarInput" name="userAvatar"
                                   onchange="validateAndPreviewAvatar(this)" type="file">

                            <div class="invalid-feedback d-none" id="avatarError">
                                Файл больше 10 МБ. Выберите изображение поменьше.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label eyebrow" for="username">Имя пользователя (логин)</label>
                            <input class="form-control" id="username" name="username" required
                                   th:value="${payload != null ? payload.username : user.username}" type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label eyebrow" for="email">Email адрес</label>
                            <input class="form-control" id="email" name="email" required
                                   th:value="${payload != null ? payload.email : user.email}" type="email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label eyebrow" for="gender">Пол</label>
                            <select class="form-select" id="gender" name="gender">
                                <option th:selected="${payload != null ? payload.gender == null : user.gender == null}"
                                        value="">Не указан
                                </option>
                                <option th:selected="${payload != null ? payload.gender == 'M' : user.gender == 'M'}"
                                        value="M">Мужчина
                                </option>
                                <option th:selected="${payload != null ? payload.gender == 'F' : user.gender == 'F'}"
                                        value="F">Женщина
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label eyebrow" for="birthDate">Дата рождения</label>
                            <input class="form-control" id="birthDate" name="birthDate"
                                   th:value="${payload != null ? payload.birthDate : user.birthDate}" type="date">
                        </div>

                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-3 border-top">
                            <a class="btn btn-outline-secondary" th:href="@{/profile}">Отмена</a>
                            <button class="btn btn-success px-4" id="submitBtn" type="submit">Сохранить изменения
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<nav th:replace="~{fragments/layout :: dock('profile')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
    function validateAndPreviewAvatar(input) {
        const errorDiv = document.getElementById('avatarError');
        const submitBtn = document.getElementById('submitBtn');
        const preview = document.getElementById('userAvatar');
        const maxSizeBytes = 10 * 1024 * 1024; // 10 МБ

        if (!input.files || !input.files[0]) {
            return;
        }

        const file = input.files[0];

        if (file.size > maxSizeBytes) {
            input.classList.add('is-invalid');
            errorDiv.classList.remove('d-none');
            errorDiv.classList.add('d-block');
            submitBtn.disabled = true;
            input.value = '';
            Merchly.notify('Файл больше 10 МБ. Выберите изображение поменьше.', 'error');
            return;
        }

        input.classList.remove('is-invalid');
        errorDiv.classList.remove('d-block');
        errorDiv.classList.add('d-none');
        submitBtn.disabled = false;

        const reader = new FileReader();
        reader.onload = function (event) {
            preview.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
