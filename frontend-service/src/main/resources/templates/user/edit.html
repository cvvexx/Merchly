<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
  <title>Редактирование профиля – Merchly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .avatar-preview-wrapper {
      width: 120px;
      height: 120px;
      overflow: hidden;
      border-radius: 50%;
      margin: 0 auto 1rem auto;
      border: 3px solid #0d6efd;
      background-color: #f8f9fa;
    }
    .avatar-preview-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
    <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">Профиль</a>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white text-center py-3">
          <h3 class="mb-0 fw-bold">Редактирование профиля</h3>
        </div>

        <div class="card-body p-4">

          <!-- Блок отображения ошибок валидации -->
          <div th:if="${errors != null}" class="alert alert-danger mb-4">
            <ul class="mb-0 ps-3">
              <li th:each="err : ${errors}" th:text="${err}">Ошибка валидации</li>
            </ul>
          </div>

          <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" id="profileForm">

            <!-- Аватарка -->
            <div class="text-center mb-4">
              <div class="avatar-preview-wrapper shadow-sm">
                <img id="userAvatar"
                     th:src="@{${userAvatar}}"
                     alt="Аватар пользователя">
              </div>

              <label for="avatarInput" class="form-label text-muted small text-uppercase fw-bold">
                Изменить аватар (до 10 МБ)
              </label>
              <input class="form-control"
                     type="file"
                     id="avatarInput"
                     name="userAvatar"
                     accept="image/*"
                     onchange="validateAndPreviewAvatar(this)">

              <div id="avatarError" class="invalid-feedback d-none">
                Размер файла не должен превышать 10 МБ!
              </div>
            </div>

            <!-- Имя пользователя (Username) -->
            <div class="mb-3">
              <label for="username" class="form-label text-muted small text-uppercase fw-bold">
                Имя пользователя (логин)
              </label>
              <input type="text"
                     class="form-control"
                     id="username"
                     name="username"
                     th:value="${payload != null ? payload.username : user.username}"
                     required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label text-muted small text-uppercase fw-bold">
                Email адрес
              </label>
              <input type="email"
                     class="form-control"
                     id="email"
                     name="email"
                     th:value="${payload != null ? payload.email : user.email}"
                     required>
            </div>

            <!-- Пол -->
            <div class="mb-3">
              <label for="gender" class="form-label text-muted small text-uppercase fw-bold">
                Пол
              </label>
              <select class="form-select" id="gender" name="gender">
                <option value="" th:selected="${payload != null ? payload.gender == null : user.gender == null}">Не указан</option>
                <option value="M" th:selected="${payload != null ? payload.gender == 'M' : user.gender == 'M'}">Мужчина</option>
                <option value="F" th:selected="${payload != null ? payload.gender == 'F' : user.gender == 'F'}">Женщина</option>
              </select>
            </div>

            <!-- Дата рождения -->
            <div class="mb-4">
              <label for="birthDate" class="form-label text-muted small text-uppercase fw-bold">
                Дата рождения
              </label>
              <input type="date"
                     class="form-control"
                     id="birthDate"
                     name="birthDate"
                     th:value="${payload != null ? payload.birthDate : user.birthDate}">
            </div>

            <!-- Кнопки -->
            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
              <a class="btn btn-outline-secondary" th:href="@{/profile}">Отмена</a>
              <button type="submit" class="btn btn-success px-4" id="submitBtn">
                Сохранить изменения
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<script>
  function validateAndPreviewAvatar(input) {
    const errorDiv = document.getElementById('avatarError');
    const submitBtn = document.getElementById('submitBtn');
    const preview = document.getElementById('userAvatar');
    const maxSizeBytes = 10 * 1024 * 1024; // 10 MB

    if (input.files && input.files[0]) {
      const file = input.files[0];

      if (file.size > maxSizeBytes) {
        input.classList.add('is-invalid');
        errorDiv.classList.remove('d-none');
        errorDiv.classList.add('d-block');
        submitBtn.disabled = true;
        return;
      } else {
        input.classList.remove('is-invalid');
        errorDiv.classList.remove('d-block');
        errorDiv.classList.add('d-none');
        submitBtn.disabled = false;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }
</script>

</body>
</html>
