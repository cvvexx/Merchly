<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Корзина | Merchly</title>
    <!-- CSRF токены для Spring Security (необходимы для DELETE запросов) -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <!-- Библиотека Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>

        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Ваша корзина</h2>

    <!-- Если корзина пуста -->
    <div class="alert alert-info" th:if="${items.isEmpty()}">
        Ваша корзина пока пуста. <a th:href="@{/catalogue/products/list}">Перейти к покупкам</a>.
    </div>

    <!-- Если в корзине есть товары -->
    <div id="cart-content" th:if="${!items.isEmpty()}">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th scope="col">Товар</th>
                <th scope="col">Цена</th>
                <th scope="col">Количество</th>
                <th scope="col">Итого</th>
                <th scope="col">Действие</th>
            </tr>
            </thead>
            <tbody>
            <!-- Добавлен id для строки (tr), чтобы JS мог ее удалить -->
            <tr th:each="item : ${items}" th:id="'cart-item-' + ${item.product.id}">
                <td>
                    <a class="d-flex align-items-center text-decoration-none text-dark"
                       th:href="@{/catalogue/products/{id}(id=${item.product.id})}">

                        <img alt="product"
                             class="img-thumbnail me-3"
                             style="width: 64px; height: 64px; object-fit: cover;"
                             th:src="@{${item.productImageUrl}}">

                        <span class="fw-bold hover-link" th:text="${item.product.title}">Название товара</span>
                    </a>
                </td>

                <td th:text="${item.product.price + ' ₽'}">1000 ₽</td>

                <td th:text="${item.quantity}">2</td>

                <td class="fw-bold" th:text="${item.subtotal + ' ₽'}">2000 ₽</td>

                <td>
                    <!--
                      Добавлены data-атрибуты:
                      data-product-id - для формирования URL запроса
                      data-subtotal - для вычитания из общей суммы в JS
                    -->
                    <button class="btn btn-sm btn-outline-danger delete-btn"
                            th:data-product-id="${item.product.id}"
                            th:data-subtotal="${item.subtotal}">
                        Удалить
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Блок оформления заказа -->
        <div class="row mt-5">
            <!-- Кнопка возврата в каталог (слева) -->
            <div class="col-md-5 mb-4">
                <a class="btn btn-outline-secondary" th:href="@{/catalogue/products/list}">
                    <i class="bi bi-arrow-left"></i> Вернуться в каталог
                </a>
            </div>

            <!-- Форма оформления заказа (справа) -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0 p-4">

                    <!-- Форма POST-запроса -->
                    <form method="post" th:action="@{/orders/create}">

                        <th:block th:each="item, stat : ${items}">
                            <input type="hidden" th:name="|items[${stat.index}].productId|" th:value="${item.product.id}" />
                            <input type="hidden" th:name="|items[${stat.index}].quantity|" th:value="${item.quantity}" />
                        </th:block>

                        <!-- Адрес доставки -->
                        <div class="mb-3 text-start">
                            <label for="address" class="form-label fw-bold">Адрес доставки <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="address" name="deliveryAddress" required
                                   placeholder="г. Москва, ул. Пушкина, д. 10, кв. 5">
                        </div>

                        <!-- Комментарий -->
                        <div class="mb-4 text-start">
                            <label for="comment" class="form-label fw-bold">Комментарий к заказу</label>
                            <textarea class="form-control" id="comment" name="comment" rows="2"
                                      placeholder="Например: Позвонить за час до доставки"></textarea>
                        </div>

                        <!-- Итого и кнопка -->
                        <div class="d-flex justify-content-between align-items-center border-top pt-4 mt-2">
                            <h4 class="mb-0">Итого:
                                <span class="text-primary fw-bold"
                                      id="total-price-value"
                                      th:data-total="${totalPrice}"
                                      th:text="${totalPrice + ' ₽'}"></span>
                            </h4>
                            <button type="submit" class="btn btn-success btn-lg">
                                Оформить заказ
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Скрипт для асинхронного удаления -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const deleteButtons = document.querySelectorAll('.delete-btn');

        deleteButtons.forEach(button => {
            button.addEventListener('click', function () {
                const productId = this.getAttribute('data-product-id');
                const subtotal = parseFloat(this.getAttribute('data-subtotal')) || 0;
                const buttonElement = this;

                buttonElement.disabled = true;

                const headers = {};
                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                fetch(`/cart/${productId}`, {
                    method: 'DELETE',
                    headers: headers
                })
                    .then(response => {
                        if (response.ok) {
                            const itemRow = document.getElementById(`cart-item-${productId}`);
                            if (itemRow) {
                                itemRow.remove();
                            }

                            const totalEl = document.getElementById('total-price-value');
                            if (totalEl) {
                                let currentTotal = parseFloat(totalEl.getAttribute('data-total')) || 0;
                                let newTotal = currentTotal - subtotal;

                                if (newTotal < 0) newTotal = 0;

                                totalEl.setAttribute('data-total', newTotal);
                                totalEl.innerText = newTotal.toFixed(2) + ' ₽';
                            }

                            if (document.querySelectorAll('.delete-btn').length === 0) {
                                window.location.reload();
                            }
                        } else {
                            throw new Error('Ошибка сервера');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Не удалось удалить товар из корзины. Попробуйте снова.');
                        buttonElement.disabled = false;
                    });
            });
        });
    });
</script>

</body>
</html>
