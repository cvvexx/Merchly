<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Корзина | Merchly</title>
    <!-- CSRF токены для Spring Security (необходимы для DELETE запросов) -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <!-- Библиотека Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>

        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/cart}">
                <i class="bi bi-cart3 me-1"></i> Корзина
            </a>
            <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Ваша корзина</h2>

    <!-- Если корзина пуста -->
    <div th:if="${items.isEmpty()}" class="alert alert-info">
        Ваша корзина пока пуста. <a th:href="@{/catalogue/products/list}">Перейти к покупкам</a>.
    </div>

    <!-- Если в корзине есть товары -->
    <div th:if="${!items.isEmpty()}" id="cart-content">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th scope="col">Товар</th>
                <th scope="col">Цена</th>
                <th scope="col">Количество</th>
                <th scope="col">Итого</th>
                <th scope="col">Действие</th>
            </tr>
            </thead>
            <tbody>
            <!-- Добавлен id для строки (tr), чтобы JS мог ее удалить -->
            <tr th:each="item : ${items}" th:id="'cart-item-' + ${item.product.id}">
                <td>
                    <a th:href="@{/catalogue/products/{id}(id=${item.product.id})}"
                       class="d-flex align-items-center text-decoration-none text-dark">

                        <img th:src="@{${item.productImageUrl}}"
                             class="img-thumbnail me-3"
                             style="width: 64px; height: 64px; object-fit: cover;"
                             alt="product">

                        <span th:text="${item.product.title}" class="fw-bold hover-link">Название товара</span>
                    </a>
                </td>

                <td th:text="${item.product.price + ' ₽'}">1000 ₽</td>

                <td th:text="${item.quantity}">2</td>

                <td th:text="${item.subtotal + ' ₽'}" class="fw-bold">2000 ₽</td>

                <td>
                    <!--
                      Добавлены data-атрибуты:
                      data-product-id - для формирования URL запроса
                      data-subtotal - для вычитания из общей суммы в JS
                    -->
                    <button class="btn btn-sm btn-outline-danger delete-btn"
                            th:data-product-id="${item.product.id}"
                            th:data-subtotal="${item.subtotal}">
                        Удалить
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Общая сумма -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <a href="/catalogue/products/list" class="btn btn-outline-secondary">Продолжить покупки</a>
            <div class="text-end">
                <!--
                  Добавлен id и data-total для управления значением из JS
                -->
                <h4 class="mb-3">Итого:
                    <span id="total-price-value"
                          th:data-total="${totalPrice}"
                          th:text="${totalPrice + ' ₽'}"
                          class="text-primary fw-bold"></span>
                </h4>
                <button class="btn btn-success btn-lg">Оформить заказ</button>
            </div>
        </div>
    </div>
</div>

<!-- Скрипт для асинхронного удаления -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        const deleteButtons = document.querySelectorAll('.delete-btn');

        deleteButtons.forEach(button => {
            button.addEventListener('click', function() {
                const productId = this.getAttribute('data-product-id');
                const subtotal = parseFloat(this.getAttribute('data-subtotal')) || 0;
                const buttonElement = this;

                buttonElement.disabled = true;

                const headers = {};
                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                fetch(`/cart/${productId}`, {
                    method: 'DELETE',
                    headers: headers
                })
                    .then(response => {
                        if (response.ok) {
                            const itemRow = document.getElementById(`cart-item-${productId}`);
                            if (itemRow) {
                                itemRow.remove();
                            }

                            const totalEl = document.getElementById('total-price-value');
                            if (totalEl) {
                                let currentTotal = parseFloat(totalEl.getAttribute('data-total')) || 0;
                                let newTotal = currentTotal - subtotal;

                                if (newTotal < 0) newTotal = 0;

                                totalEl.setAttribute('data-total', newTotal);
                                totalEl.innerText = newTotal.toFixed(2) + ' ₽';
                            }

                            if (document.querySelectorAll('.delete-btn').length === 0) {
                                window.location.reload();
                            }
                        } else {
                            throw new Error('Ошибка сервера');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Не удалось удалить товар из корзины. Попробуйте снова.');
                        buttonElement.disabled = false;
                    });
            });
        });
    });
</script>

</body>
</html>
