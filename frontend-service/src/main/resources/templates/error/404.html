<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Страница не найдена | Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="col-md-5 text-center">
        <div class="card shadow border-0 p-4">
            <div class="card-body">
                <div class="display-1 fw-bold text-secondary mb-3">404</div>

                <h2 class="h4 fw-bold text-dark mb-3">Страница не найдена</h2>

                <p class="text-muted mb-4">
                    К сожалению, запрашиваемая страница не существует, была удалена или перенесена по новому адресу.
                </p>

                <div class="d-grid gap-2">
                    <a class="btn btn-primary btn-lg" th:href="@{/}">Вернуться на главную</a>
                    <a class="btn btn-outline-secondary" th:href="@{/catalogue/products/list}">Перейти в каталог</a>
                </div>
            </div>
        </div>
    </div>
</div>
