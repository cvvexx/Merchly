<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Страница не найдена')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar('none')}"></nav>

<main class="container page-center">
    <div class="col-12 col-md-7 col-lg-5 text-center">
        <div class="card shadow border-0 reveal">
            <div class="card-body p-4 p-lg-5">
                <p class="display-1 fw-bold mono text-secondary mb-3">404</p>

                <h1 class="h4 fw-bold mb-3">Страница не найдена</h1>

                <p class="text-muted mb-4">
                    Такого адреса нет. Возможно, товар сняли с продажи или ссылка устарела.
                </p>

                <div class="d-grid gap-2">
                    <a class="btn btn-primary btn-lg" th:href="@{/catalogue/products/list}">Перейти в каталог</a>
                    <a class="btn btn-outline-secondary" th:href="@{/}">На главную</a>
                </div>
            </div>
        </div>
    </div>
</main>

<nav th:replace="~{fragments/layout :: dock('none')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
