<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступ запрещен | Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <a th:href="@{/profile}" class="btn btn-outline-info btn-sm">В профиль</a>
    </div>
</nav>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="col-md-5 text-center">
        <div class="card shadow border-0 p-4">
            <div class="card-body">
                <div class="display-1 fw-bold text-danger mb-3">403</div>

                <h2 class="h4 fw-bold text-dark mb-3">Доступ ограничен</h2>

                <p class="text-muted mb-4">
                    У вашего аккаунта недостаточно прав для просмотра этой страницы.
                    Если вы считаете, что это ошибка, пожалуйста, обратитесь к администратору.
                </p>

                <div class="d-grid gap-2">
                    <a class="btn btn-primary btn-lg" th:href="@{/}">Вернуться на главную</a>
                    <a class="btn btn-outline-secondary" href="javascript:history.back()">&larr; Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
