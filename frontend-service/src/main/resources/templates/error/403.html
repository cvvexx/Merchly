<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступ ограничен | Merchly</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .error-card {
            background: #2a2a2a;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 380px;
            text-align: center;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #ff4757;
            margin: 0 0 10px 0;
            line-height: 1;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        p {
            color: #aaa;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: #2ed573;
            border: none;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .btn-home:hover {
            background: #26af5f;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-code">403</div>
    <h2>Доступ ограничен</h2>
    <p>У вашей учетной записи недостаточно прав для просмотра этой страницы. Если вы считаете, что это ошибка,
        обратитесь к администратору.</p>

    <a class="btn-home" th:href="@{/}">На главную</a>
</div>

</body>
</html>
