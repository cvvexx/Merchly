<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка сервера | Merchly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">Merchly</a>
        <a class="btn btn-outline-info btn-sm" th:href="@{/profile}">В профиль</a>
    </div>
</nav>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="col-md-5 text-center">
        <div class="card shadow border-0 p-4">
            <div class="card-body">
                <div class="display-1 fw-bold text-warning mb-3">500</div>

                <h2 class="h4 fw-bold text-dark mb-3">Что-то пошло не так</h2>

                <p class="text-muted mb-4">
                    На сервере произошла непредвиденная ошибка. Мы уже в курсе проблемы и работаем над её устранением.
                    Пожалуйста, попробуйте обновить страницу позже.
                </p>

                <div class="d-grid gap-2">
                    <button class="btn btn-warning text-white btn-lg fw-bold" onclick="location.reload()">
                        Обновить страницу
                    </button>
                    <a class="btn btn-primary" th:href="@{/}">На главную</a>
                    <a class="btn btn-outline-secondary" href="javascript:history.back()">&larr; Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
