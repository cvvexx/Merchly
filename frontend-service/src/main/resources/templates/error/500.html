<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка сервера')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar('none')}"></nav>

<main class="container page-center">
    <div class="col-12 col-md-7 col-lg-5 text-center">
        <div class="card shadow border-0 reveal">
            <div class="card-body p-4 p-lg-5">
                <p class="display-1 fw-bold mono text-warning mb-3">500</p>

                <h1 class="h4 fw-bold mb-3">Сервер не ответил</h1>

                <p class="text-muted mb-4">
                    Запрос не дошёл до конца. Мы уже знаем о проблеме — обновите страницу через минуту.
                </p>

                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg" onclick="location.reload()" type="button">
                        Обновить страницу
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/}">На главную</a>
                </div>
            </div>
        </div>
    </div>
</main>

<nav th:replace="~{fragments/layout :: dock('none')}"></nav>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
