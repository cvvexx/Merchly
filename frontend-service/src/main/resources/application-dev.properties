spring.application.name=frontend-service
spring.restclient.uri.product_service=http://localhost:8081
spring.restclient.uri.user_service=http://localhost:8082
spring.restclient.uri.reviews_service=http://localhost:8083
spring.restclient.uri.orders_service=http://localhost:8084
spring.mvc.hiddenmethod.filter.enabled=true
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.apache.hc.client5.http=DEBUG
logging.level.org.springframework.security=DEBUG
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8090/realms/merchly
spring.security.oauth2.client.registration.keycloak.client-id=merchly_frontend_client
spring.security.oauth2.client.registration.keycloak.client-secret=${FRONTEND_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.internal-service-client.client-id=merchly_frontend_client
spring.security.oauth2.client.registration.internal-service-client.client-secret=${FRONTEND_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.internal-service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.internal-service-client.scope=openid
spring.security.oauth2.client.registration.internal-service-client.provider=keycloak
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8090/realms/merchly/protocol/openid-connect/token
keycloak.client-id=merchly_frontend_client
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:SuperSecretRedisPass2026!}
spring.session.store-type=redis
spring.session.timeout=30m
minio.url=${MINIO_URL}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB