spring.application.name=frontend-service
spring.restclient.uri.product_service=http://localhost:8081
spring.restclient.uri.user_service=http://localhost:8082
spring.restclient.uri.reviews_service=http://localhost:8083
spring.restclient.uri.orders_service=http://localhost:8084
spring.mvc.hiddenmethod.filter.enabled=true
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:9999/dummy-authorization-uri
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:9999/dummy-token-uri
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost:9999/dummy-jwk-set-uri
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost:9999/dummy-user-info-uri
spring.security.oauth2.client.registration.keycloak.client-id=test-client
spring.security.oauth2.client.registration.keycloak.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.internal-service-client.client-id=test-client
spring.security.oauth2.client.registration.internal-service-client.client-secret=test-secret
spring.security.oauth2.client.registration.internal-service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.internal-service-client.scope=openid
spring.security.oauth2.client.registration.internal-service-client.provider=keycloak
keycloak.client-id=test-client
spring.session.store-type=redis
spring.session.timeout=30m
minio.url=http://localhost:9000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
