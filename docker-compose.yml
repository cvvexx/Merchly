version: '3.8'

services:
  users_db:
    image: postgres:16
    container_name: merchly_users_db
    restart: always
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data

  products_db:
    image: postgres:16
    container_name: merchly_products_db
    restart: always
    environment:
      POSTGRES_USER: ${PRODUCTS_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      POSTGRES_DB: ${PRODUCTS_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_products:/var/lib/postgresql/data

  reviews_db:
    image: postgres:16
    container_name: merchly_reviews_db
    restart: always
    environment:
      POSTGRES_USER: ${REVIEWS_DB_USER:reviews_admin}
      POSTGRES_PASSWORD: ${REVIEWS_DB_PASSWORD:12341234}
      POSTGRES_DB: ${REVIEWS_DB_NAME:merchly_reviews}
    ports:
      - "5435:5432"
    volumes:
      - pgdata_reviews:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: merchly_redis
    restart: always
    command: "redis-server --requirepass ${REDIS_PASSWORD:-12345678} --appendonly yes"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  keycloak_db:
    image: postgres:16
    container_name: merchly_keycloak_db
    restart: always
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_keycloak:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: merchly_keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      KC_HTTP_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - keycloak_db

  minio:
    image: minio/minio:latest
    container_name: merchly_minio
    restart: always
    ports:
      - "9000:9000" 
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"


volumes:
  pgdata_users:
  pgdata_products:
  pgdata_reviews:
  redisdata:
  pgdata_keycloak:
  minio_data: