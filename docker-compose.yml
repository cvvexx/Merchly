services:
  # --- DATABASES ---
  users_db:
    image: postgres:16
    container_name: merchly_users_db
    environment:
      POSTGRES_USER: ${USERS_DB_USER:--user}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:--1234}
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_users:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  products_db:
    image: postgres:16
    container_name: merchly_products_db
    environment:
      POSTGRES_USER: ${PRODUCTS_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD}
      POSTGRES_DB: ${PRODUCTS_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_products:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PRODUCTS_DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  reviews_db:
    image: postgres:16
    container_name: merchly_reviews_db
    environment:
      POSTGRES_USER: ${REVIEWS_DB_USER}
      POSTGRES_PASSWORD: ${REVIEWS_DB_PASSWORD}
      POSTGRES_DB: ${REVIEWS_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - pgdata_reviews:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${REVIEWS_DB_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak_db:
    image: postgres:16
    container_name: merchly_keycloak_db
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_keycloak:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- INFRASTRUCTURE ---
  redis:
    image: redis:7-alpine
    container_name: merchly_redis
    command: "redis-server --requirepass ${REDIS_PASSWORD:-12345678} --appendonly yes"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: merchly_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      # ИСПРАВЛЕНО: Внутренний порт всегда 5432
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_pass}
      KC_HTTP_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      keycloak_db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: merchly_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5

    # 👇 Служебный контейнер для автоматической настройки бакетов
  minio-init:
    image: minio/mc
    container_name: merchly_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/merchly-products --ignore-existing;
      /usr/bin/mc mb myminio/merchly-users --ignore-existing;
      /usr/bin/mc anonymous set download myminio/merchly-products;
      /usr/bin/mc anonymous set download myminio/merchly-users;
      exit 0;
      "

  # --- MICROSERVICES ---
  users-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: merchly_users_service
    env_file:
      - .env
    environment:
      # ИСПРАВЛЕНО: localhost -> имена контейнеров внутри сети
      SPRING_DATASOURCE_URL: jdbc:postgresql://users_db:5432/${USERS_DB_NAME}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8090/realms/merchly
      KEYCLOAK_SERVER_URL: http://keycloak:8090
      MINIO_URL: http://minio:9000
    depends_on:
      users_db:
        condition: service_healthy

  products-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: merchly_products_service
    env_file:
      - .env
    environment:
      # ИСПРАВЛЕНО: Порт 5433 заменен на 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://products_db:5432/${PRODUCTS_DB_NAME}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8090/realms/merchly
      MINIO_URL: http://minio:9000
    depends_on:
      products_db:
        condition: service_healthy
      redis:
        condition: service_started

  reviews-service:
    build:
      context: .
      dockerfile: review-service/Dockerfile
    container_name: merchly_reviews_service
    env_file:
      - .env
    environment:
      # ИСПРАВЛЕНО: Порт 5435 заменен на 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://reviews_db:5432/${REVIEWS_DB_NAME}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8090/realms/merchly
    depends_on:
      reviews_db:
        condition: service_healthy

  frontend-service:
    build:
      context: .
      dockerfile: frontend-service/Dockerfile
    container_name: merchly_frontend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_RESTCLIENT_URI_USER_SERVICE: http://users-service:8082
      SPRING_RESTCLIENT_URI_PRODUCT_SERVICE: http://products-service:8081
      SPRING_RESTCLIENT_URI_REVIEWS_SERVICE: http://reviews-service:8083
      SPRING_DATA_REDIS_HOST: redis
      MINIO_URL: http://minio:9000
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE: preferred_username
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://localhost:8090/realms/merchly/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8090/realms/merchly/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: http://keycloak:8090/realms/merchly/protocol/openid-connect/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8090/realms/merchly/protocol/openid-connect/certs

      FRONTEND_SERVICE_CLIENT_SECRET: ${FRONTEND_SERVICE_CLIENT_SECRET}
    depends_on:
      - users-service
      - products-service
      - reviews-service
      - keycloak

volumes:
  pgdata_users:
  pgdata_products:
  pgdata_reviews:
  redisdata:
  pgdata_keycloak:
  minio_data: