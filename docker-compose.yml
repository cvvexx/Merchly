version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: merchly_db
    restart: always
    environment:
      POSTGRES_USER: cvvexxx
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: merchly_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: